# Example job. Copy, rename, edit. The file name is the job name.
# Validate with: tarea validate
schedule: "0 8 * * *"        # standard 5-field cron, server local time
model: anthropic/claude-sonnet-4.5
fallbacks: [openai/gpt-5-mini]
budget_usd: 1.00             # hard cap per run (0 = default 0.10)
max_steps: 20                # LLM calls per run; the last one is forced to be text
prompt: |
  Using jobshunt, show me data analyst positions within 50 miles of Austin, Texas.
  If nothing is new, reply exactly NOTHING_NEW.
mcp:
  - name: jobshunt
    url: https://mcp.dice.com/mcp
    allow: [search_jobs]
memory: {file: memory.md, max_kb: 128}
sinks:
  - type: telegram
    chat_id: "${TG_CHAT}"
    # audio: true
