# Example job. Copy, rename, edit. The file name is the job name.
# Validate with: agentd validate
schedule: "0 8 * * *"        # standard 5-field cron, server local time
model: anthropic/claude-sonnet-4.5
fallbacks: [openai/gpt-5-mini]
budget_usd: 0.10             # hard cap per run (0 = default 0.10)
max_steps: 8                 # LLM calls per run; the last one is forced to be text
prompt: |
  Find upcoming gigs (next 60 days) for the artists I listen to most.
  Use seen_check on stable keys (artist + date + venue) and only report new ones.
  After reporting, call seen_add with those keys.
  Format: one line per gig: "Artist - City - Venue - Date - link".
  If nothing is new, reply exactly NOTHING_NEW.
mcp:
  - name: library
    command: ["./mcp-library"]
    allow: [top_artists]               # mandatory allow-list; ["*"] exposes every tool
  - name: events
    url: https://example.com/mcp
    headers: {Authorization: "Bearer ${EVENTS_KEY}"}
    allow: [search_events]
memory: {file: memory.md, max_kb: 64}
sinks:
  - type: telegram
    chat_id: "${TG_CHAT}"
